spring.application.name=OpsFlow
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.task.scheduling.pool.size=3
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packages-to-scan=io.github.xw66.opsflow
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/opsflow?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:opsflow}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
mybatis.configuration.default-statement-timeout=10
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
opsflow.attachments.directory=${ATTACHMENT_DIRECTORY:data/attachments}
opsflow.assignment.enabled=${ASSIGNMENT_ENABLED:true}
opsflow.assignment.interval-ms=5000
opsflow.assignment.batch-size=100
opsflow.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
opsflow.ai.enabled=${AI_ENABLED:false}
opsflow.ai.api-key=${AI_API_KEY:}
opsflow.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
opsflow.ai.model=${AI_MODEL:gpt-4o-mini}
opsflow.ai.timeout-ms=${AI_TIMEOUT_MS:10000}
opsflow.statistics.enabled=${STATISTICS_ENABLED:true}
opsflow.statistics.interval-ms=${STATISTICS_INTERVAL_MS:60000}
opsflow.sla.enabled=${SLA_ENABLED:true}
opsflow.sla.interval-ms=${SLA_INTERVAL_MS:10000}
opsflow.sla.batch-size=${SLA_BATCH_SIZE:100}
opsflow.sla.warning-seconds=${SLA_WARNING_SECONDS:300}
opsflow.messaging.enabled=${MESSAGING_ENABLED:true}
opsflow.messaging.topic=opsflow.ticket-events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=50
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3
spring.kafka.admin.fail-fast=false
opsflow.jwt.secret=${JWT_SECRET}
opsflow.jwt.issuer=opsflow
opsflow.jwt.ttl-seconds=1800
opsflow.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
opsflow.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
opsflow.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
